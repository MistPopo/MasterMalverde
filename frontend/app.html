<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>M.Malv | Inicio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f172a;--card:#1f2937;--ink:#e5e7eb;--muted:#9ca3af;--acc:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0; font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial; background:#0f172a; color:var(--ink)}
  header{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#111827; border-bottom:1px solid rgba(255,255,255,.08)}
  .grid{display:grid; gap:16px; grid-template-columns:1.2fr .8fr; padding:16px}
  .card{background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:16px}
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px}
  input,select,textarea{width:100%; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:#0b1226; color:var(--ink)}
  button{padding:10px 12px; border-radius:10px; border:0; font-weight:700; cursor:pointer; background:var(--acc); color:#111827}
  table{width:100%; border-collapse:collapse} th,td{padding:8px; border-bottom:1px solid rgba(255,255,255,.12); text-align:left}
  .form-grid{display:grid; gap:12px; grid-template-columns:repeat(2,minmax(220px,1fr))}
  .full{grid-column:1/-1}
  .calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .day{padding:10px; text-align:center; border-radius:8px; background:#111827; color:#cbd5e1}
  .day.other{background:#ef4444; color:#fff}
  .badge{display:inline-flex; align-items:center; gap:6px; background:#111827; border:1px solid rgba(255,255,255,.12); color:#e5e7eb; padding:6px 10px; border-radius:999px; font-size:12px}
  .actions{margin-top:10px}
  /* Fotoreferencias */
  .photo-wrap{display:grid; gap:12px; grid-template-columns:repeat(2,minmax(220px,1fr))}
  .photo-box{border:1px dashed rgba(255,255,255,.2); border-radius:12px; background:#0b1226; min-height:180px; display:grid; place-items:center; overflow:hidden}
  .photo-box img{max-width:100%; max-height:100%; display:block}
  @media (max-width: 1024px){ .grid{grid-template-columns:1fr} .photo-wrap{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div style="display:flex; align-items:center; gap:10px">
    <div style="width:28px; height:28px; border-radius:8px; background:repeating-linear-gradient(135deg,#f59e0b,#f59e0b 10px,#1f1f1f 10px,#1f1f1f 20px)"></div>
    <strong>MasterMalverde</strong>
  </div>
  <div>
    <span id="who" class="badge"></span>
    <button id="logout">Salir</button>
  </div>
</header>

<div class="grid">
  <!-- Agendar -->
  <section class="card">
    <h2>Agendar</h2>
    <form id="resForm">
      <div class="form-grid">
        <div>
          <label>Servicio</label>
          <select id="service" required></select>
        </div>
        <div>
          <label>Hora</label>
          <input id="time" type="time" required>
        </div>
        <div>
          <label>Fecha</label>
          <input id="date" type="date" required>
        </div>
        <div>
          <label>Dirección</label>
          <input id="address" placeholder="Calle 123, Comuna">
        </div>
        <div class="full">
          <label>Notas</label>
          <textarea id="notes" rows="2" placeholder="Indicaciones, referencias…"></textarea>
        </div>
      </div>
      <div class="actions"><button id="btnSave">Guardar</button></div>
    </form>
    <div id="msg" style="color:#9ca3af; margin-top:8px"></div>
  </section>

  <!-- Calendario -->
  <section class="card">
    <h2>Calendario</h2>
    <div id="cal" class="calendar"></div>
  </section>
</div>

<!-- Fotoreferencias -->
<section class="card" style="margin:0 16px">
  <h2>Fotoreferencias</h2>
  <div class="photo-wrap">
    <div class="photo-box"><img id="photoPrev" alt="Previsualización" style="display:none"></div>
    <div>
      <label>Subir imagen (JPG/PNG)</label>
      <input id="photoInput" type="file" accept="image/*">
      <p style="color:var(--muted); font-size:12px; margin-top:8px">
        Aquí podrás cargar fotos de referencia del trabajo (fachada, sector a intervenir, etc.).
      </p>
    </div>
  </div>
</section>

<!-- Mis reservas -->
<section class="card" style="margin:16px">
  <h2>Mis reservas</h2>
  <table>
    <thead><tr><th>Fecha</th><th>Hora</th><th>Servicio</th><th>Dirección</th><th>Estado</th><th></th></tr></thead>
    <tbody id="mine"></tbody>
  </table>
</section>

<!-- Panel trabajador (se mantiene por si usas ese rol) -->
<section class="card" style="margin:16px" id="workerPanel" hidden>
  <h2>Asignadas a mí (Trabajador)</h2>
  <table>
    <thead><tr><th>Fecha</th><th>Hora</th><th>Servicio</th><th>Cliente</th><th>Estado</th><th>Acción</th></tr></thead>
    <tbody id="assigned"></tbody>
  </table>
</section>

<script src="./api.js"></script>
<script>
const who = document.getElementById('who');
const msg = (t)=> document.getElementById('msg').textContent = t||'';

async function me(){ return (await API.get('/api/me')).user; }
async function catalog(){ return await API.get('/api/catalog'); }
async function publicMonth(yymm){ return await API.get('/api/reservations/public?month='+yymm); }
async function mine(){ return await API.get('/api/reservations/mine'); }
async function assigned(){ return await API.get('/api/reservations/assigned'); }

function yymm(d){ return d.toISOString().slice(0,7); }
function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }

function dayCells(container, data){
  container.innerHTML='';
  const now = new Date();
  const total = daysInMonth(now);
  for(let i=1;i<=total;i++){
    const el = document.createElement('div'); el.className='day'; el.textContent=i;
    const dd = String(i).padStart(2,'0');
    if(data && data.byDay && data.byDay[dd]) el.classList.add('other'); // marca días con reservas públicas
    container.appendChild(el);
  }
}

async function boot(){
  const token = API.getToken(); if(!token){ location.href = 'index.html'; return; }
  try{
    const u = await me();
    who.textContent = u.name+' ('+u.role+')';

    // Catalogo
    const items = await catalog();
    const svc = document.getElementById('service');
    svc.innerHTML = items.map(s=>`<option value="${s.id}">${s.title}</option>`).join('');

    // Calendario
    const pm = await publicMonth(yymm(new Date()));
    dayCells(document.getElementById('cal'), pm);

    // Mis reservas
    renderMine(await mine());

    // Panel worker (si inicia como worker)
    if(u.role==='worker'){
      document.getElementById('workerPanel').hidden = false;
      renderAssigned(await assigned());
    }

    // Guardar reserva (sin worker ni duración)
    const form = document.getElementById('resForm');
    const btnSave = document.getElementById('btnSave');
    form.onsubmit = async (e)=>{
      e.preventDefault();
      btnSave.disabled = true; btnSave.textContent = 'Guardando...'; msg('');
      try{
        await API.post('/api/reservations', {
          service_id: Number(document.getElementById('service').value),
          date: document.getElementById('date').value,
          time: document.getElementById('time').value,
          address: document.getElementById('address').value,
          notes: document.getElementById('notes').value
        });
        msg('✅ Reserva guardada');
        form.reset();
        renderMine(await mine());
      }catch(err){
        msg(err?.error || 'Error al reservar');
      }finally{
        btnSave.disabled = false; btnSave.textContent = 'Guardar';
      }
    };

    // Logout
    document.getElementById('logout').onclick = ()=>{
      localStorage.removeItem('mm-token'); location.href='index.html';
    };

    // Fotoreferencias (previsualización local)
    const input = document.getElementById('photoInput');
    const prev = document.getElementById('photoPrev');
    input.addEventListener('change', ()=>{
      const f = input.files?.[0];
      if(!f) { prev.style.display='none'; prev.src=''; return; }
      const url = URL.createObjectURL(f);
      prev.src = url; prev.style.display='block';
    });

  }catch(e){
    localStorage.removeItem('mm-token'); location.href='index.html';
  }
}

function renderMine(list){
  const mineEl = document.getElementById('mine');
  mineEl.innerHTML='';
  for(const r of list){
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.date}</td><td>${r.time}</td><td>${r.service_title||''}</td><td>${r.address||''}</td><td>${r.status}</td><td><button data-id="${r.id}">Eliminar</button></td>`;
    mineEl.appendChild(tr);
  }
  mineEl.querySelectorAll('button[data-id]').forEach(b => {
    b.onclick = async ()=>{
      try{
        await API.del('/api/reservations/'+b.dataset.id);
        renderMine(await mine());
      }catch(err){ msg(err?.error || 'No se pudo eliminar'); }
    };
  });
}

function renderAssigned(list){
  const tbody = document.getElementById('assigned');
  tbody.innerHTML='';
  for(const r of list){
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.date}</td><td>${r.time}</td><td>${r.service_title||''}</td><td>${r.address||''}</td><td>${r.status}</td>
      <td><select data-id="${r.id}">
        <option ${r.status==='scheduled'?'selected':''}>scheduled</option>
        <option ${r.status==='in_progress'?'selected':''}>in_progress</option>
        <option ${r.status==='done'?'selected':''}>done</option>
        <option ${r.status==='canceled'?'selected':''}>canceled</option>
      </select></td>`;
    tbody.appendChild(tr);
  }
  tbody.querySelectorAll('select[data-id]').forEach(s => {
    s.onchange = async ()=>{
      try{
        await API.patch('/api/reservations/'+s.dataset.id+'/status', {status:s.value});
      }catch(err){ msg(err?.error || 'No se pudo actualizar el estado'); }
    };
  });
}

boot();
</script>
</body>
</html>
