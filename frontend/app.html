<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MasterMalverde | Mis citas</title>
<style>
  :root{ --bg:#f7f4ef; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e7e1d7; --acc:#c2410c; --soft:#fbeee6; --ok:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#14110e; --card:#1d1915; --ink:#f3ede4; --muted:#a8a095; --line:#302a23; --soft:#2a211a; } }
  *{box-sizing:border-box}
  body{margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5}
  .wrap{max-width:900px; margin:0 auto; padding:0 16px}
  header{border-bottom:1px solid var(--line); background:var(--card)}
  header .wrap{display:flex; align-items:center; justify-content:space-between; height:60px; gap:10px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; text-decoration:none; color:var(--ink)}
  .logo{width:30px; height:30px; border-radius:8px; background:repeating-linear-gradient(135deg,var(--acc) 0 10px,#1f1f1f 10px 20px)}
  .btn{display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:10px; padding:8px 14px; font-weight:700; font-size:14px; cursor:pointer; background:var(--acc); color:#fff; text-decoration:none}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
  .btn.danger{background:transparent; color:var(--bad); border:1px solid var(--line)}
  h1{font-size:24px; margin:24px 0 4px} .sub{color:var(--muted); margin:0 0 16px}
  .list{display:grid; gap:12px}
  .item{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
  .when{font-weight:800} .meta{color:var(--muted); font-size:14px}
  .badge{display:inline-block; font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--soft); color:var(--acc)}
  .badge.done{color:var(--ok)} .badge.canceled{color:var(--muted); text-decoration:line-through}
  select{font:inherit; padding:8px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink)}
  .empty{color:var(--muted); padding:16px 0}
  .msg{min-height:22px; color:var(--bad); font-size:14px}
  section{margin-bottom:28px}
  [hidden]{display:none!important}
  .photo-wrap{display:grid; gap:12px; grid-template-columns:repeat(2,minmax(220px,1fr)); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px}
  .photo-box{border:1px dashed var(--line); border-radius:12px; min-height:180px; display:grid; place-items:center; overflow:hidden; color:var(--muted); font-size:14px}
  .photo-box img{max-width:100%; max-height:260px; display:block}
  @media (max-width:640px){ .photo-wrap{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="index.html"><span class="logo" aria-hidden="true"></span> MasterMalverde</a>
    <div style="display:flex; gap:8px; align-items:center">
      <span id="who" class="meta"></span>
      <a class="btn" href="index.html#agendar">Agendar</a>
      <button class="btn ghost" id="logout" type="button">Salir</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section>
    <h1>Mis citas</h1>
    <p class="sub">Tus visitas agendadas. Puedes eliminar las que aún no se realizan.</p>
    <p id="msg" class="msg" role="alert"></p>
    <div id="mine" class="list"></div>
  </section>

  <section>
    <h1>Fotoreferencias</h1>
    <p class="sub">Carga fotos de referencia del trabajo (fachada, sector a intervenir, etc.).</p>
    <div class="photo-wrap">
      <div class="photo-box"><span id="photoEmpty">Sin imagen</span><img id="photoPrev" alt="Previsualización" hidden></div>
      <div>
        <label for="photoInput" style="font-weight:700">Subir imagen (JPG/PNG)</label>
        <input id="photoInput" type="file" accept="image/*" style="display:block; margin-top:8px">
      </div>
    </div>
  </section>

  <section id="workerPanel" hidden>
    <h1>Visitas asignadas a mí</h1>
    <p class="sub">Actualiza el estado a medida que avanzas.</p>
    <div id="assigned" class="list"></div>
  </section>
</main>

<script src="./api.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const STATUS = { scheduled:'Agendada', in_progress:'En curso', done:'Realizada', canceled:'Cancelada' };
  const KIND = { cotizacion:'Cotización', trabajo:'Trabajo' };
  const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const nice = (iso) => { const [y,m,d] = iso.split('-').map(Number); return `${d} ${MONTHS[m-1]} ${y}`; };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const msg = (t) => { $('msg').textContent = t || ''; };

  function card(r, actions) {
    return `<div class="item">
      <div>
        <div class="when">${nice(r.date)} · ${r.time}</div>
        <div class="meta">${KIND[r.kind] || 'Visita'}${r.service_title ? ' · ' + esc(r.service_title) : ''}</div>
        <div class="meta">${esc(r.address)}</div>
        ${r.notes ? `<div class="meta">${esc(r.notes)}</div>` : ''}
      </div>
      <div style="display:flex; gap:8px; align-items:center">
        <span class="badge ${r.status}">${STATUS[r.status] || r.status}</span>
        ${actions}
      </div>
    </div>`;
  }

  async function loadMine() {
    const list = await API.get('/api/reservations/mine');
    $('mine').innerHTML = list.length ? list.map(r => card(r,
      r.status === 'scheduled' ? `<button class="btn danger" data-cancel="${r.id}" type="button">Eliminar</button>` : ''
    )).join('') : '<p class="empty">Aún no tienes citas. <a href="index.html#agendar">Agenda tu primera visita</a>.</p>';
  }

  async function loadAssigned() {
    const list = await API.get('/api/reservations/assigned');
    $('assigned').innerHTML = list.length ? list.map(r => card(r,
      `<select data-status="${r.id}" aria-label="Estado">${Object.entries(STATUS).map(([k,v]) =>
        `<option value="${k}" ${k === r.status ? 'selected' : ''}>${v}</option>`).join('')}</select>`
    )).join('') : '<p class="empty">No tienes visitas asignadas.</p>';
  }

  $('mine').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-cancel]');
    if (!b) return;
    b.disabled = true; msg('');
    try { await API.del('/api/reservations/' + b.dataset.cancel); await loadMine(); }
    catch (err) { msg(err.error); b.disabled = false; }
  });

  $('assigned').addEventListener('change', async (e) => {
    const s = e.target.closest('select[data-status]');
    if (!s) return;
    msg('');
    try { await API.patch('/api/reservations/' + s.dataset.status + '/status', { status: s.value }); await loadAssigned(); }
    catch (err) { msg(err.error); }
  });

  // Fotoreferencias (previsualización local, como en la versión original)
  $('photoInput').addEventListener('change', () => {
    const f = $('photoInput').files?.[0];
    const prev = $('photoPrev');
    if (!f) { prev.hidden = true; prev.src = ''; $('photoEmpty').hidden = false; return; }
    prev.src = URL.createObjectURL(f); prev.hidden = false; $('photoEmpty').hidden = true;
  });

  $('logout').onclick = () => { API.setToken(''); location.href = 'index.html'; };

  (async function boot() {
    if (!API.getToken()) { location.href = 'index.html'; return; }
    let user;
    try { user = (await API.get('/api/me')).user; }
    catch { API.setToken(''); location.href = 'index.html'; return; }
    if (user.role === 'admin') { location.href = 'admin.html'; return; }
    $('who').textContent = user.name;
    try {
      await loadMine();
      if (user.role === 'worker') { $('workerPanel').hidden = false; await loadAssigned(); }
    } catch (err) { msg(err.error || 'No se pudieron cargar tus citas.'); }
  })();
})();
</script>
</body>
</html>
